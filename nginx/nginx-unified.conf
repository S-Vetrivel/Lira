upstream backend {
    server 127.0.0.1:5000;
}

server {
    listen 3000 default_server;
    server_name _;
    root /app/Web/dist;
    index index.html;

    # Debug Header (To verify this config is active)
    add_header X-Debug-Source "container-nginx-unified" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # 1. Immutable Assets (Vite hashes these)
    location ~* \.(?:js|mjs|css|woff2?|eot|ttf|otf|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 2. Static Images & Media
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|avif|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ @backend;
    }

    # 3. Backend API
    location /api {
        try_files $uri @backend;
    }

    # 4. Uploads
    location /uploads {
        try_files $uri @backend;
    }

    # 5. Frontend Routing (React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location @backend {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Timeouts
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
