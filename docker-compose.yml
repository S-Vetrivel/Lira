version: "3.9"

networks:
  infra_internal:
    external: true

services:
  backend:
    build: ./Backend
    container_name: 4i-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    networks:
      - infra_internal
    # Removed direct port exposure
    cpus: "0.75"
    mem_limit: 1g

  frontend:
    build: ./Web
    container_name: 4i-frontend
    restart: unless-stopped
    networks:
      - infra_internal
    # Removed direct port exposure
    cpus: "0.10"
    mem_limit: 128m

  nginx:
    image: nginx:alpine
    container_name: 4i-nginx
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - infra_internal
