version: "3.9"

services:
  backend:
    build: ./Backend
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    build: ./Web
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
