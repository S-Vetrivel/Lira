version: "3.9"

networks:
  infra_internal:
    external: true

services:
  app:
    build: .
    container_name: 4i-app
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - infra_internal
    cpus: "1.0"
    mem_limit: 1.5g
