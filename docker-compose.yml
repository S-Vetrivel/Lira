networks:
  infra_internal:
    external: true

services:
  lira:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lira-app
    restart: unless-stopped
    env_file:
      - ./Backend/.env
      - ./Web/.env
    ports:
      - "127.0.0.1:3010:3010"
    networks:
      - infra_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "1.0"
    mem_limit: 1.5g
