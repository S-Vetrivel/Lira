name: "deploy:Lira"

on:
  push:
    branches:
      - main

jobs:
  verify-backend:
    name: verify-backend-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Backend JS syntax
        run: find Backend -name "*.js" -not -path "*/node_modules/*" -exec node --check {} +

  verify-frontend:
    name: verify-frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build Web
        working-directory: Web
        run: |
          npm install
          npm run build

  deploy:
    name: deploy-to-vps
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Lira app
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ops
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          script: |
            set -e
            cd /opt/apps/Lira

            # Resolve potential git ownership issues
            git config --global --add safe.directory /opt/apps/Lira

            # Fetch and reset
            git fetch origin main
            git reset --hard origin/main

            # Rebuild and start via Docker Compose
            docker compose up --build -d --remove-orphans

            # Prune dangling images to save space
            docker builder prune -f
